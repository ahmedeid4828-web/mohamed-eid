<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Employee Utilization Tracker</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #4a00e0, #8e2de2);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
}
.container {
  background: #fff;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0px 6px 20px rgba(0,0,0,0.2);
  width: 500px;
}
h2 { text-align: center; margin-bottom: 25px; color: #333; }
label { display: block; margin: 12px 0 6px; font-weight: bold; }
input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
button { margin-top: 20px; width: 100%; padding: 12px; background: #8e2de2; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: background 0.3s; }
button:hover { background: #4a00e0; }
.result { margin-top: 25px; font-size: 16px; text-align: center; font-weight: bold; color: #333; background: #f2f2f2; padding: 12px; border-radius: 10px; }
</style>
</head>
<body>

<div class="container">
<h2>Employee Utilization Tracker</h2>

<label for="workedHours">Hours Worked:</label>
<input type="number" id="workedHours" placeholder="e.g., 8">

<label for="breakHours">Break Hours:</label>
<input type="number" id="breakHours" placeholder="e.g., 1">

<button onclick="calculateUtilization()">Calculate</button>
<button onclick="saveToSheet()">💾 Save Result</button>

<div class="result" id="result"></div>
</div>

<script>
const url = "https://script.google.com/macros/s/AKfycbz8qypeVYX0wH_p6KcxmbfSLbYe1bfjVSJmkmsZBsPA-VGmqbfMdAFzRFp2inFwsHhU/exec";
let sheetData = [];
let lastResult = null;

// Fetch all employees from Google Sheet automatically
async function loadEmployees() {
  try {
    const response = await fetch(url);
    const data = await response.json();
    sheetData = data.slice(1); // skip header
  } catch(err) {
    document.getElementById("result").innerHTML = "❌ Error loading employee data.";
    console.error(err);
  }
}

function calculateUtilization() {
  if(sheetData.length === 0){
    document.getElementById("result").innerHTML = "⚠️ Employee data not loaded yet.";
    return;
  }

  const workedHours = parseFloat(document.getElementById("workedHours").value);
  const breakHours = parseFloat(document.getElementById("breakHours").value);
  const resultDiv = document.getElementById("result");

  if(isNaN(workedHours) || isNaN(breakHours)){
    resultDiv.innerHTML = "⚠️ Please enter valid hours.";
    return;
  }

  let outputHTML = "";
  sheetData.forEach(employee => {
    const name = employee[0];
    const callDuration = parseFloat(employee[1]) || 0;
    const callsCount = parseInt(employee[2]) || 0;

    const netHours = workedHours - breakHours;
    const utilization = (callDuration / netHours) * 100;

    outputHTML += `
      👤 ${name}<br>
      ⏱️ Call Duration: ${callDuration} hours<br>
      📞 Calls Count: ${callsCount}<br>
      🕒 Net Hours Worked: ${netHours}<br>
      📊 Utilization: ${utilization.toFixed(2)}%<hr>
    `;

    lastResult = { name, workedHours, breakHours, callDuration, callsCount, utilization };
  });

  resultDiv.innerHTML = outputHTML;
}

// Save results to Google Sheet
async function saveToSheet() {
  if(!lastResult){ alert("⚠️ Please calculate first."); return; }

  try{
    const response = await fetch(url, {
      method: "POST",
      body: JSON.stringify(lastResult)
    });
    const result = await response.text();
    alert("✅ Result saved successfully.");
  } catch(err){
    alert("❌ Error saving result.");
    console.error(err);
  }
}

loadEmployees();
</script>

</body>
</html>
