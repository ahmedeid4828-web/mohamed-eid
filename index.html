<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>نموذج حساب Utilization</title>
  <style>
    body {
      font-family: "Cairo", sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background: #fff;
      padding: 25px 30px;
      border-radius: 15px;
      box-shadow: 0px 6px 15px rgba(0,0,0,0.15);
      width: 450px;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
    label {
      display: block;
      margin: 10px 0 5px;
    }
    select, input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      margin-top: 15px;
      width: 100%;
      padding: 10px;
      background: #2575fc;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #1b5edb;
    }
    .result {
      margin-top: 20px;
      font-size: 16px;
      text-align: center;
      font-weight: bold;
      color: #333;
      background: #f7f7f7;
      padding: 10px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>حساب Utilization</h2>

    <label for="agent">اختر الموظف:</label>
    <select id="agent">
      <option value="">⏳ جاري تحميل الأسماء...</option>
    </select>

    <label for="workedHours">عدد الساعات اللي اشتغلها:</label>
    <input type="number" id="workedHours" placeholder="مثال: 8">

    <label for="breakHours">عدد ساعات البريك:</label>
    <input type="number" id="breakHours" placeholder="مثال: 1">

    <button onclick="calculateUtilization()">احسب</button>
    <button onclick="saveToSheet()">💾 احفظ النتيجة</button>

    <div class="result" id="result"></div>
  </div>

  <script>
    const url = "https://script.google.com/macros/s/AKfycbwQaRlpFsEWfO_BRRgGNCwFRicRUTRDN96w6iVBXO_QFGbZZq2kgAylBogUWqI7BUO2/exec";
    let sheetData = [];
    let lastResult = null;

    // تحميل أسماء الموظفين
    async function loadAgents() {
      try {
        const response = await fetch(url);
        const data = await response.json();
        sheetData = data.slice(1); // استبعاد الصف الأول (العناوين)

        const agentSelect = document.getElementById("agent");
        agentSelect.innerHTML = "<option value=''>-- اختر الموظف --</option>";

        sheetData.forEach(row => {
          const name = row[0];
          if (name) {
            const option = document.createElement("option");
            option.value = name;
            option.textContent = name;
            agentSelect.appendChild(option);
          }
        });
      } catch (error) {
        document.getElementById("agent").innerHTML = "<option>❌ خطأ في تحميل الأسماء</option>";
        console.error(error);
      }
    }

    // حساب Utilization
    function calculateUtilization() {
      const agent = document.getElementById("agent").value;
      const workedHours = parseFloat(document.getElementById("workedHours").value);
      const breakHours = parseFloat(document.getElementById("breakHours").value);
      const resultDiv = document.getElementById("result");

      if (!agent || isNaN(workedHours) || isNaN(breakHours)) {
        resultDiv.innerHTML = "⚠️ من فضلك أدخل جميع البيانات.";
        return;
      }

      const employee = sheetData.find(r => r[0] === agent);
      if (!employee) {
        resultDiv.innerHTML = "⚠️ الموظف غير موجود في الشيت.";
        return;
      }

      const callDuration = parseFloat(employee[1]) || 0; // مدة المكالمات
      const callsCount = parseInt(employee[2]) || 0;     // عدد المكالمات

      const netHours = workedHours - breakHours;
      const utilization = (callDuration / netHours) * 100;

      lastResult = {
        agent, workedHours, breakHours, callDuration, callsCount, utilization
      };

      resultDiv.innerHTML = `
        👤 الموظف: ${agent}<br>
        ⏱️ مدة المكالمات: ${callDuration} ساعة<br>
        📞 عدد المكالمات: ${callsCount}<br>
        🕒 ساعات العمل الفعلية: ${netHours}<br>
        📊 نسبة Utilization = ${utilization.toFixed(2)}%
      `;
    }

    // حفظ في Google Sheet
    async function saveToSheet() {
      if (!lastResult) {
        alert("⚠️ لازم تحسب الأول قبل الحفظ.");
        return;
      }

      try {
        const response = await fetch(url, {
          method: "POST",
          body: JSON.stringify(lastResult)
        });

        const result = await response.text();
        alert("✅ تم حفظ النتيجة في الشيت.");
      } catch (error) {
        alert("❌ حصل خطأ أثناء الحفظ.");
        console.error(error);
      }
    }

    loadAgents();
  </script>
</body>
</html>
